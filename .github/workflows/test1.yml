name: forTest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04  # self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: output environ variable
        run: |
          echo "=======it's a test========="
          echo "run number=$GITHUB_RUN_NUMBER"
          echo "run_id=$GITHUB_RUN_ID"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          echo "curpath=$(pwd)"
          echo "github_output=$GITHUB_OUTPUT"
          echo "---------------------------------------"
          echo "Source branch commit ID: ${{ github.event.pull_request.head.sha }}"
          echo "Target branch commit ID: ${{ github.event.pull_request.base.sha }}"
          export GITHUB_BASE_SHA=${{ github.event.pull_request.base.sha }}
          export GITHUB_HEAD_SHA=${{ github.event.pull_request.head.sha }}
          # echo "=============================================="
          # export -p
          # echo "=============================================="
          echo "output------------------end"
    
      - name: run scripts
        id: run-scripts
        run: python3 -u scripts/actions_test.py
      
      - name: output return values
        run: |
          echo ${{ steps.run-scripts.outputs.build_path }}
      
      - name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            ${{ steps.run-scripts.outputs.build_path }}
            "!${{ steps.run-scripts.outputs.build_path }}/*.json"
          retention-days: 2        # 2天后自动删除
