name: Cppcheck Report
on: [push
]

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run Cppcheck
        run: 
|
          cppcheck --enable=all --output-file=cppcheck_report.txt --error-exitcode=1 src 2>&1 | tee cppcheck_output.log
        continue-on-error: true  # 即使发现问题也继续生成报告

      - name: Install cppcheck-htmlreport
        run: pip install cppcheck-htmlreport

      - name: Generate HTML report
        run: 
|
          mkdir -p cppcheck_html_report
          cppcheck-htmlreport --file=cppcheck_report.txt --report-dir=cppcheck_html_report --source-dir=.

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-html-report
          path: cppcheck_html_report/
